# SonarCloud / SonarQube Configuration for NoStream (PS5)

sonar.projectKey=qbyss_nostream
sonar.organization=qbyss
sonar.projectName=NoStream PS5

# Source and Test directories
sonar.sources=projects/evoplayer
sonar.tests=tests
sonar.exclusions=**/cJSON.c,**/cJSON.h,**/*.inc,output/**

# C / C++ Compilation Database & Code Coverage
sonar.cfamily.compile-commands=compile_commands.json
sonar.cfamily.gcov.reportsPath=output/tests,output/coverage

# Encoding
sonar.sourceEncoding=UTF-8
